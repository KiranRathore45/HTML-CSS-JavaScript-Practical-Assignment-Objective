<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a program to find the largest of three numbers.</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><h1>HTML · CSS · JavaScript Practical Programs</h1><nav class="nav"><a href="../index.html">Home</a><a href="../html/index.html">HTML</a><a href="../css/index.html">CSS</a><a href="../javascript/index.html">JavaScript</a><a href="../README.html">README</a></nav></header><main class="container"><section class="hero"><span class="badge">JavaScript Program 3</span><h2>Write a program to find the largest of three numbers.</h2><div class="demo"><input id="a" type="number" value="12"><input id="b" type="number" value="25"><input id="c" type="number" value="8"><button onclick="runProgram()">Run Program</button><div id="out" class="output">Click Run Program</div></div></section></main><script>function runProgram(){try{const a=+document.getElementById('a').value,b=+document.getElementById('b').value,c=+document.getElementById('c').value; result=Math.max(a,b,c);document.getElementById('out').textContent=String(result)}catch(e){document.getElementById('out').textContent='Error: '+e.message}}</script>
