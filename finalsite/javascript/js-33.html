<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a counter application with increment and decrement buttons.</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><h1>HTML · CSS · JavaScript Practical Programs</h1><nav class="nav"><a href="../index.html">Home</a><a href="../html/index.html">HTML</a><a href="../css/index.html">CSS</a><a href="../javascript/index.html">JavaScript</a><a href="../README.html">README</a></nav></header><main class="container"><section class="hero"><span class="badge">JavaScript Program 34</span><h2>Create a counter application with increment and decrement buttons.</h2><div class="demo"><button onclick="window.counter=(window.counter||0)+1;out.textContent=window.counter">Increment</button><button onclick="window.counter=(window.counter||0)-1;out.textContent=window.counter">Decrement</button><button onclick="runProgram()">Run Program</button><div id="out" class="output">Click Run Program</div></div></section></main><script>function runProgram(){try{result=window.counter||0;document.getElementById('out').textContent=String(result)}catch(e){document.getElementById('out').textContent='Error: '+e.message}}</script>
