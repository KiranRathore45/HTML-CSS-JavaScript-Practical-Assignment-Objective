<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a program to find the frequency of each element in an array.</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><h1>HTML · CSS · JavaScript Practical Programs</h1><nav class="nav"><a href="../index.html">Home</a><a href="../html/index.html">HTML</a><a href="../css/index.html">CSS</a><a href="../javascript/index.html">JavaScript</a><a href="../README.html">README</a></nav></header><main class="container"><section class="hero"><span class="badge">JavaScript Program 59</span><h2>Write a program to find the frequency of each element in an array.</h2><div class="demo"><input id="arr" value="a,b,a,c,b,a" style="width:280px"><button onclick="runProgram()">Run Program</button><div id="out" class="output">Click Run Program</div></div></section></main><script>function runProgram(){try{const f={}; document.getElementById('arr').value.split(',').forEach(x=>f[x]=(f[x]||0)+1); result=JSON.stringify(f);document.getElementById('out').textContent=String(result)}catch(e){document.getElementById('out').textContent='Error: '+e.message}}</script>
