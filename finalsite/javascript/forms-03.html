<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a password strength checker.</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><h1>HTML · CSS · JavaScript Practical Programs</h1><nav class="nav"><a href="../index.html">Home</a><a href="../html/index.html">HTML</a><a href="../css/index.html">CSS</a><a href="../javascript/index.html">JavaScript</a><a href="../README.html">README</a></nav></header><main class="container"><section class="hero"><span class="badge">Forms &amp; Validation 3</span><h2>Create a password strength checker.</h2><div class="demo"><form onsubmit="return validateForm(event)"><input id="name" placeholder="Name"><input id="email" placeholder="Email"><button>Submit</button></form><div id="out" class="output"></div></div></section></main><script>function validateForm(e){e.preventDefault();const n=name.value.trim(),em=email.value.trim();out.textContent=n&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?"Valid form":"Please enter a valid name and email";return false}</script>
